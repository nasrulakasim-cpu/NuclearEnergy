<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Task Tracker</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>📋 Daily Task Tracker</h1>
      <p id="today-date" class="today-date"></p>
    </header>

    <section class="progress-card">
      <div class="progress-info">
        <span id="progress-label">0 of 0 tasks done</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
    </section>

    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="What do you need to do today?"
        autocomplete="off"
        required
      />
      <select id="task-priority" title="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button type="submit">Add Task</button>
    </form>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list" class="task-list"></ul>

    <p id="empty-state" class="empty-state">No tasks yet — add one above to get started 🚀</p>

    <footer class="app-footer">
      <button id="clear-completed" class="text-btn">Clear completed</button>
      <span id="task-count" class="task-count"></span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
